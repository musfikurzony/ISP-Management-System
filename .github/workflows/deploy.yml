# Builds the application and publishes it to Cloudflare Pages.
# Runs automatically on every push to "main", or by pressing "Run workflow"
# on the GitHub Actions page.
#
# One-time setup: add two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - a Cloudflare API token (see README, "Deploy")
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check that the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first (see README)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the screens
        run: npm run build
      - name: Create the Pages project (first run only)
        run: npx wrangler pages project create isp-billing --production-branch main || true
      - name: Update the database structure
        run: |
          npx wrangler d1 migrations apply isp_billing_db --remote
          npx wrangler d1 migrations apply isp_billing_db_preview --remote --env preview
      - name: Publish the website
        run: npx wrangler pages deploy --branch main --commit-dirty=true
      - name: Install the daily billing scheduler
        run: npx wrangler deploy --config cron-worker/wrangler.jsonc
