# Automatic database backup, every night at 02:00 Bangladesh time.
# The backup is a password-protected .7z file kept for 30 days under
# GitHub > Actions > (this run) > Artifacts. Open it with the free 7-Zip program.
#
# Needs three repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (same as the deploy workflow)
#   BACKUP_PASSWORD - a long password you choose; needed to open the backup file
name: Nightly database backup

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Skip when the secrets are not set up yet
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$BACKUP_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Backup skipped: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and BACKUP_PASSWORD secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Export and encrypt the database
        if: steps.ready.outputs.ok == 'true'
        run: |
          npm ci
          STAMP=$(TZ=Asia/Dhaka date +%Y-%m-%d)
          npx wrangler d1 export isp_billing_db --remote --output="isp-billing-$STAMP.sql"
          7z a -mhe=on -p"$BACKUP_PASSWORD" "isp-billing-$STAMP.7z" "isp-billing-$STAMP.sql" > /dev/null
          rm "isp-billing-$STAMP.sql"
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          name: database-backup
          path: isp-billing-*.7z
          retention-days: 30
